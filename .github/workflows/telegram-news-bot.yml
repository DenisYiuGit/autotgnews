name: Telegram News Bot
on:
  schedule:
    - cron: '0 * * * *'  # запуск каждый час
  workflow_dispatch:  # ручной запуск

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # разрешение на запись в репозиторий (для .json)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}  # добавь, если используешь логи
        run: python main.py

      - name: Commit and push updated published.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add published.json
          git diff --staged --quiet || (git commit -m "Update published news [skip ci]" && git push)
