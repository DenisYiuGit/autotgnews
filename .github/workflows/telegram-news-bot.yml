name: Telegram News Bot
on:
  schedule:
    - cron: '0 * * * *'  # запуск каждый час
  workflow_dispatch:  # ручной запуск

concurrency:
  group: telegram-bot
  cancel-in-progress: true

env:
  # Бот живёт ~50 минут и выходит сам, не дожидаясь отмены следующего запуска.
  BOT_RUN_SECONDS: '3000'
  BOT_POLL_SECONDS: '60'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Держим запас до часа, но сам бот выходит раньше (BOT_RUN_SECONDS),
    # чтобы следующий cron-запуск не убил текущий на середине.
    timeout-minutes: 55
    permissions:
      contents: write  # разрешение на запись в репозиторий (для .json)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
          TELEGRAM_CHANNEL_NAME: ${{ secrets.TELEGRAM_CHANNEL_NAME }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}  # добавь, если используешь логи
        run: python main.py

      # published.json — список опубликованных новостей,
      # settings.json — интервал, статистика и last_processed_update_id.
      # Без второго файла команды из ЛС забываются при каждом запуске.
      - name: Commit and push bot state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add published.json settings.json
          git diff --staged --quiet || (git commit -m "Update bot state [skip ci]" && git push)
